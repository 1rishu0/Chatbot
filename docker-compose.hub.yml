services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    image: 1rishu0/chatbot-backend:latest
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: llama3.1
      OLLAMA_BASE_URL: http://ollama:11434
      SQLITE_PATH: /data/db.sqlite3
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - backend_data:/data
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    image: 1rishu0/chatbot-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  backend_data: